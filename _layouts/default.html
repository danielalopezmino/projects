<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  </head>

  <body class="page-{{ page.section | default: 'general' }}">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Ir al inicio">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>{{ site.author.name | default: site.title }}</span>
        </a>

        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation">
          <span class="sr-only">Abrir menú</span>
          <span></span><span></span><span></span>
        </button>

        <nav id="site-navigation" class="site-nav" aria-label="Navegación principal">
          <a href="{{ '/ui-ux/' | relative_url }}" {% if page.section == 'ui-ux' %}aria-current="page"{% endif %}>UI/UX</a>
          <a href="{{ '/diseno-grafico/' | relative_url }}" {% if page.section == 'diseno-grafico' %}aria-current="page"{% endif %}>Diseño gráfico</a>
          <a href="{{ '/fotografia/' | relative_url }}" {% if page.section == 'fotografia' %}aria-current="page"{% endif %}>Fotografía</a>
          <a href="{{ '/escritura-creativa/' | relative_url }}" {% if page.section == 'escritura-creativa' %}aria-current="page"{% endif %}>Escritura</a>
        </nav>
      </div>
    </header>

    <main id="contenido">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <p class="footer-title">{{ site.author.name }}</p>
          <p>{{ site.author.role }} · {{ site.author.location }}</p>
        </div>
        <div class="footer-links">
          <a href="mailto:{{ site.author.email }}">Email</a>
          <a href="{{ site.social.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
          <a href="{{ site.social.instagram }}" target="_blank" rel="noreferrer">Instagram</a>
        </div>
        <p class="footer-meta">© {{ 'now' | date: '%Y' }} · Creado con GitHub Pages</p>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
