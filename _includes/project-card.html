<article class="project-card">
  <a class="project-card-image" href="{{ include.post.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ include.post.cover | relative_url }}" alt="" loading="lazy">
  </a>
  <div class="project-card-body">
    <p class="project-card-meta">{{ include.post.category_label }}{% if include.post.year %} · {{ include.post.year }}{% endif %}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.description }}</p>
    <a class="text-link" href="{{ include.post.url | relative_url }}">Ver proyecto <span aria-hidden="true">↗</span></a>
  </div>
</article>
